name: Update Google Calendar Manager page for 1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-google-calendar-manager-1.0.4.yml

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update project pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('projects/google-calendar-manager/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('Google Calendar Manager 1.0.3', 'Google Calendar Manager 1.0.4')
          index = index.replace('Wersja 1.0.3', 'Wersja 1.0.4')
          index = index.replace('/v1.0.3/googleCalendarManager-1.0.3.nvda-addon', '/v1.0.4/googleCalendarManager-1.0.4.nvda-addon')
          index = index.replace('/tag/v1.0.3', '/tag/v1.0.4')
          index = index.replace('wydania 1.0.3', 'wydania 1.0.4')
          index = index.replace(
              '4b1209d0530dee8cc1c522a832f4928e76246626719763b156787ed4a55d6717',
              '4253e0abf42893a0d56b18ac373a695c98cb900f6399854b55baa3d773c605aa',
          )
          marker = '            <li>edytuje istniejące wydarzenia,</li>\n'
          addition = (
              '            <li>edytuje istniejące wydarzenia,</li>\n'
              '            <li>prawidłowo zachowuje rok i wielodniowy zakres podczas edycji oraz obsługuje zmianę wydarzenia godzinowego na całodniowe,</li>\n'
              '            <li>pokazuje techniczne szczegóły błędu w dostępnym oknie NVDA,</li>\n'
          )
          if marker not in index:
              raise SystemExit('Project feature marker not found')
          index = index.replace(marker, addition, 1)
          index_path.write_text(index, encoding='utf-8', newline='\n')

          projects_path = Path('projects.html')
          projects = projects_path.read_text(encoding='utf-8')
          projects = projects.replace('Aktualna wersja to 1.0.3.', 'Aktualna wersja to 1.0.4.')
          projects_path.write_text(projects, encoding='utf-8', newline='\n')

          terms_path = Path('projects/google-calendar-manager/terms.html')
          terms = terms_path.read_text(encoding='utf-8')
          terms = terms.replace('Data obowiązywania: 21 lipca 2026 r.', 'Data obowiązywania: 25 lipca 2026 r.')
          terms = terms.replace('Wersja 1.0.3 jest najnowszą publiczną wersją testową.', 'Wersja 1.0.4 jest najnowszą publiczną wersją testową.')
          terms_path.write_text(terms, encoding='utf-8', newline='\n')
          PY

      - name: Commit page updates and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-google-calendar-manager-1.0.4.yml
          git add projects/google-calendar-manager/index.html projects.html projects/google-calendar-manager/terms.html
          git commit -m "Update Google Calendar Manager pages for 1.0.4"
          git push origin HEAD:main
